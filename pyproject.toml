[project]
name = "nornir_napalm"
version = "0.6.0"
description = "NAPALM's plugins for nornir"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "napalm>=5,<6",
    # allow-prereleases carried over from Poetry: the >=3.0.0a0 floor opts nornir
    # (and only nornir) into prereleases, matching the old `allow-prereleases = true`.
    "nornir>=3.0.0a0,<4",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir_napalm"

[project.entry-points."nornir.plugins.connections"]
napalm = "nornir_napalm.plugins.connections:Napalm"

[dependency-groups]
dev = [
    "mypy==1.9.0",
    "ruff",
    "pytest>=9.0.3,<10",
    "nbval>=0.11.0,<0.12",
    "jupyter>=1,<2",
    "nornir-utils",
    "pytest-cov>=5.0.0,<6",
]
docs = [
    "sphinx>=7,<8",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "nbsphinx>=0.9,<0.10",
    "sphinx-issues>=4,<5",
    "sphinx-rtd-theme>=2,<3",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
# ruff format would otherwise reformat notebooks (incl. generated docs); keep them out of scope
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Port of the previous pylama linters: pep8 (E/W) + pyflakes (F) + mccabe (C90)
select = ["E", "W", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
#addopts = --cov=nornir --cov-report=term-missing -vs
pythonpath = ["./"]
filterwarnings = [
    "ignore::nornir.core.exceptions.ConflictingConfigurationWarning",
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
exclude = ["tests"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
