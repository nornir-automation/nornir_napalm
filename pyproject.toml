[tool.poetry]
name = "nornir_napalm"
version = "0.5.0"
description = "NAPALM's plugins for nornir"
authors = ["David Barroso <dbarrosop@dravetech.com>"]
license = "Apache-2.0"

[tool.poetry.plugins."nornir.plugins.connections"]
"napalm" = "nornir_napalm.plugins.connections:Napalm"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
napalm = "^5"
nornir = { version = "~3", allow-prereleases = true }

[tool.poetry.dev-dependencies]
mypy = "1.9.0"
ruff = "*"
pytest = "^9.0.3"
nbval = "^0.11.0"
jupyter = "^1"
sphinx = "^7"
sphinxcontrib-napoleon = "^0.7"
nbsphinx = "^0.9"
sphinx-issues = "^4"
sphinx_rtd_theme = "^2"
nornir_utils = { version = "*", allow-prereleases = true }
pytest-cov = "^5.0.0"

[tool.ruff]
line-length = 100
# ruff format would otherwise reformat notebooks (incl. generated docs); keep them out of scope
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Port of the previous pylama linters: pep8 (E/W) + pyflakes (F) + mccabe (C90)
select = ["E", "W", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
#addopts = --cov=nornir --cov-report=term-missing -vs
pythonpath = ["./"]
filterwarnings = [
    "ignore::nornir.core.exceptions.ConflictingConfigurationWarning",
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
exclude = ["tests"]

[build-system]
requires = ["poetry>=1.3.2"]
build-backend = "poetry.masonry.api"
