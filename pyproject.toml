[project]
name = "nornir_napalm"
version = "0.6.0"
description = "NAPALM's plugins for nornir"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "napalm>=5,<6",
    # allow-prereleases carried over from Poetry: the >=3.0.0a0 floor opts nornir
    # (and only nornir) into prereleases, matching the old `allow-prereleases = true`.
    "nornir>=3.0.0a0,<4",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir_napalm"

[project.entry-points."nornir.plugins.connections"]
napalm = "nornir_napalm.plugins.connections:Napalm"

[dependency-groups]
dev = [
    "mypy==1.9.0",
    "ruff",
    "pytest>=9.0.3,<10",
    "nbval>=0.11.0,<0.12",
    "jupyter>=1,<2",
    "nornir-utils",
    "pytest-cov>=5.0.0,<6",
]
docs = [
    "sphinx>=7,<8",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "nbsphinx>=0.9,<0.10",
    "sphinx-issues>=4,<5",
    "sphinx-rtd-theme>=2,<3",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
# ruff format would otherwise reformat notebooks (incl. generated docs); keep them out of scope
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "COM812", # Conflicts with the formatter, which handles trailing commas itself
    "CPY001", # Missing copyright notice at top of file
    "D203",   # Incompatible with D211, ruff warns unless one is disabled
    "D213",   # Incompatible with D212, ruff warns unless one is disabled
]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.per-file-ignores]


"nornir_napalm/**/*.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN401", # Dynamically typed expressions (typing.Any) disallowed
    "D100",   # Missing docstring in public module
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean default positional argument in function definition
    "I001",   # Import block is un-sorted or un-formatted
    "PGH003", # Use specific rule codes when ignoring type issues
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "RUF022", # `__all__` is not sorted
    "SIM105", # Use `contextlib.suppress(...)` instead of `try`-`except`-`pass`
]


"tests/**/*.py" = [
    "S101",   # Use of `assert` detected, ok in tests
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "ANN001", # Missing type annotation for function argument
    "ANN201", # Missing return type annotation for public function
    "ARG001", # Unused function argument
    "B007",   # Loop control variable not used within loop body
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D400",   # First line should end with a period
    "D401",   # First line of docstring should be in imperative mood
    "D415",   # First line should end with a period, question mark, or exclamation point
    "I001",   # Import block is un-sorted or un-formatted
    "INP001", # File is part of an implicit namespace package, add an `__init__.py`
    "PERF102", # When using only the values of a dict use the `values()` method
    "PT003",  # `scope='function'` is implied in `@pytest.fixture()`
    "PTH120", # `os.path.dirname()` should be replaced by `Path.parent`
    "SLF001", # Private member accessed
]


"docs/source/conf.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "A001",   # Variable is shadowing a Python builtin
    "D100",   # Missing docstring in public module
    "ERA001", # Found commented-out code
    "INP001", # File is part of an implicit namespace package, add an `__init__.py`
]


[tool.pytest.ini_options]
#addopts = --cov=nornir --cov-report=term-missing -vs
pythonpath = ["./"]
filterwarnings = [
    "ignore::nornir.core.exceptions.ConflictingConfigurationWarning",
]

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
exclude = ["tests"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
